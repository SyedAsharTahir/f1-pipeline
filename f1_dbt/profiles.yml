f1_dbt:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      port: "{{ env_var('DBT_PORT', env_var('POSTGRES_PORT', '5432')) | as_number }}"
      schema: staging
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      threads: 4