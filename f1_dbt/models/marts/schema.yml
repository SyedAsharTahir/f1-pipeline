#declare tests on model
version: 2
models:
  - name: dim_races
    columns: 
      - name: race_id
        tests: [unique,not_null]
  
  - name: dim_drivers
    columns: 
      - name: driver_id
        tests: [unique,not_null]

  - name: dim_constructors
    columns: 
      - name: constructor_id
        tests: [unique,not_null]  
  
  - name: fct_results
    columns: 
      - name: result_id
        tests: [unique,not_null]
      - name: race_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_races')
                field: race_id
      - name: driver_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_drivers')
                field: driver_id
      - name: constructor_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_constructors')
                field: constructor_id
